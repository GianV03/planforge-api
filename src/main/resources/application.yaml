server:
  port: 8080

spring:
  application:
    name: planforge-api

  datasource:
    url: jdbc:postgresql://localhost:5432/planforge
    username: postgres
    password: postgres

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true

  redis:
    host: localhost
    port: 6379

logging:
  level:
    org.springframework.security: DEBUG